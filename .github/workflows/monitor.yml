name: Monitor IMAX

on:
  schedule:
    # UTC; cada 30 minutos evitando el comienzo de la hora.
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'monitor envía alertas; dry-run simula; resolve-* resuelve un envío incierto'
        type: choice
        default: monitor
        options:
          - monitor
          - dry-run
          - test-telegram
          - resolve-sent
          - resolve-retry

permissions:
  contents: read

concurrency:
  group: imax-ticket-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Consultar y notificar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_MODE: ${{ inputs.mode || 'monitor' }}
        run: python -m imax_notifier --github-state --mode "$RUN_MODE"
